<title>Anachronist Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&family=IM+Fell+English+SC&display=swap">
<style>
/* Layout: a loom. Enemies along the top, the Track as the warp across the middle, your hand as the weft below. */
:root {
  --bg: #eceef3;
  --panel: #fbfbfd;
  --ink: #1b2030;
  --muted: #586074;
  --line: #cdd3de;
  --accent: #3b4bc8;
  --on-accent: #ffffff;
  --scrim: rgba(17, 20, 32, 0.45);
  --faith: #9a6c0c;
  --compute: #08788b;
  --flux: #7443bd;
  --neutral: #687083;
  --era: #85603b;
  --tear: #b0303d;
  --good: #2b7444;
  --bad: #b0303d;
  --font-display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
  --art-filter: none;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10121a;
    --panel: #191c27;
    --ink: #e5e7ef;
    --muted: #99a0b3;
    --line: #2b3040;
    --accent: #9aa6ff;
    --on-accent: #11131f;
    --scrim: rgba(0, 0, 0, 0.6);
    --faith: #e2b450;
    --compute: #45c3d5;
    --flux: #b48df1;
    --neutral: #a9afbd;
    --era: #c69d74;
    --tear: #f07280;
    --good: #6cc48b;
    --bad: #f07280;
    --art-filter: brightness(0.86) saturate(0.92);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --art-filter: brightness(0.86) saturate(0.92);
  --bg: #10121a;
  --panel: #191c27;
  --ink: #e5e7ef;
  --muted: #99a0b3;
  --line: #2b3040;
  --accent: #9aa6ff;
  --on-accent: #11131f;
  --scrim: rgba(0, 0, 0, 0.6);
  --faith: #e2b450;
  --compute: #45c3d5;
  --flux: #b48df1;
  --neutral: #a9afbd;
  --era: #c69d74;
  --tear: #f07280;
  --good: #6cc48b;
  --bad: #f07280;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.45 var(--font-body);
  padding-inline: 16px;
  padding-block: 12px 24px;
  margin: 0;
}
#app { max-width: 920px; margin: 0 auto; display: grid; gap: 12px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
.empty { color: var(--muted); font-size: 13px; }
.label { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.label span { text-transform: none; letter-spacing: 0; font-weight: 400; }
.nums { font-family: var(--font-data); font-size: 13px; font-variant-numeric: tabular-nums; display: inline-flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }

button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: 0.45; cursor: default; }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }
.primary.big { padding: 12px 22px; font-size: 17px; }
.ghost { background: transparent; }
.linkish { justify-self: start; background: none; border: none; padding: 2px 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.linkish.is-on { font-weight: 700; }
input, textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
textarea { width: 100%; font-family: var(--font-data); font-size: 12px; }

/* Masthead and tools */
.masthead { display: grid; gap: 2px; }
.brand { font-family: var(--font-display); font-weight: 400; font-size: 30px; letter-spacing: 0.02em; line-height: 1.1; }
.brand span { color: var(--muted); font-size: 0.7em; }
.where { color: var(--muted); font-size: 13px; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tools button, .menu > summary { font-size: 13px; padding: 5px 10px; }
.topbar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; }
.tb-where { min-width: 0; flex: 1 1 260px; font-size: 13px; color: var(--muted); }
.tb-brand { font-family: var(--font-display); font-weight: 400; font-size: 20px; color: var(--ink); }
.tb-sub { font-family: var(--font-display); font-size: 15px; margin-right: 6px; }
.tb-line { display: inline-block; }
/* Menus: a details element; any action re-renders the page, which closes it. */
.menu { position: relative; display: inline-block; }
details.menu[open] { display: inline-block; }
.menu > summary { list-style: none; display: inline-block; font-weight: 400; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.menu > summary::-webkit-details-marker { display: none; }
.menu > summary::after { content: " ▾"; color: var(--muted); }
.menu[open] > summary { border-color: var(--accent); }
.menu-list { position: absolute; z-index: 8; top: calc(100% + 4px); left: 0; min-width: 220px; display: grid; gap: 4px; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 28px color-mix(in srgb, var(--ink) 22%, transparent); }
.menu.is-end .menu-list { left: auto; right: 0; }
.menu-list button { text-align: left; width: 100%; }
.notice { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; background: color-mix(in srgb, var(--accent) 10%, var(--panel)); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); border-radius: var(--radius); padding: 10px 12px; }
.notice span { flex: 1 1 260px; min-width: 0; }
.notice button { font-size: 13px; }

/* Setup */
.setup { display: grid; gap: 18px; }
.block { display: grid; gap: 10px; }
.ops { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.op { text-align: left; display: grid; gap: 4px; padding: 12px 14px; border-color: color-mix(in srgb, var(--fc) 40%, var(--line)); }
.op.is-on { outline: 2px solid var(--fc); outline-offset: 0; background: color-mix(in srgb, var(--fc) 8%, var(--panel)); }
.op-name { font-family: var(--font-display); font-size: 22px; color: var(--fc); }
.op-meta, .op-sig { font-family: var(--font-data); font-size: 12px; color: var(--muted); }
.op-blurb { font-size: 14px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg .is-on, .pill.is-on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.encs { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
.enc { text-align: left; display: grid; gap: 2px; padding: 10px 12px; }
.enc.is-on { outline: 2px solid var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--panel)); }
.enc-name { font-weight: 700; }
.enc-where { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.enc.is-elite .enc-where { color: var(--bad); }
.enc-foes { font-size: 13px; }
.start { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; }
.seed { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seed input { width: 9em; font-family: var(--font-data); }
details summary { cursor: pointer; font-weight: 700; }
details[open] { display: grid; gap: 8px; }
.decklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.decklist li { display: grid; grid-template-columns: auto auto 1fr; gap: 2px 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line); }
.dl-count { font-family: var(--font-data); font-size: 12px; color: var(--muted); }
.dl-name { font-family: var(--font-display); font-size: 17px; color: var(--fc, var(--ink)); }
.dl-cost { white-space: nowrap; }
.dl-text { grid-column: 1 / -1; font-size: 13px; color: var(--muted); min-width: 0; }

/* Board: the enemies pinned to the top, you pinned to the bottom, your hand in between. */
.board { display: grid; gap: 10px; }
.fightline { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 12px; color: var(--muted); }
.fightline .nums { font-size: 12px; }

.foes { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; margin: -12px -16px 0; padding: 8px 16px; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.foe-row { display: grid; grid-template-columns: repeat(var(--cols, 1), minmax(0, 440px)); justify-content: center; gap: 8px; }
.foes[data-n="2"] { --cols: 2; }
.foes[data-n="3"] { --cols: 3; }
.foes[data-n="4"] { --cols: 4; }
.foe { display: grid; gap: 4px; align-content: start; min-width: 0; padding: 6px 8px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--fc); }
.foe.is-dead { opacity: 0.45; }
.foe.is-chosen { outline: 2px solid var(--accent); }
.foe-main { display: grid; gap: 3px; text-align: left; background: none; border: none; padding: 0; border-radius: 6px; min-width: 0; }
.foe-main.is-target { outline: 2px dashed var(--accent); outline-offset: 2px; cursor: pointer; }
.foe-id { display: flex; gap: 8px; align-items: center; min-width: 0; }
.foe-id .art { flex: none; width: 52px; aspect-ratio: 4 / 3; }
.foe-names { display: grid; min-width: 0; }
.foe-name { font-family: var(--font-display); font-size: 18px; line-height: 1.1; overflow-wrap: anywhere; }
.tag { font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--fc); }
.foe .nums { font-size: 12px; gap: 2px 8px; }
.meter { display: block; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--line) 70%, transparent); overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--bad); }
.intents { display: grid; gap: 3px; }
.intent { display: flex; gap: 6px; align-items: flex-start; font-size: 13px; line-height: 1.3; text-align: left; min-width: 0; overflow-wrap: anywhere; }
button.intent { padding: 3px 5px; border-style: dashed; border-color: var(--accent); }
button.intent.is-chosen { outline: 2px solid var(--accent); border-style: solid; }
.dial { flex: none; display: inline-grid; place-items: center; width: 20px; height: 20px; border: 1.5px solid currentColor; border-radius: 50%; font: 600 11px/1 var(--font-data); }
.dmg { font-family: var(--font-data); color: var(--bad); }
.pressure { font-size: 12px; color: var(--faith); white-space: nowrap; }
.fixed { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; border: 1px solid var(--muted); border-radius: 4px; padding: 0 4px; color: var(--muted); }
.status { font-family: var(--font-body); font-size: 12px; border-radius: 999px; padding: 0 7px; background: color-mix(in srgb, var(--line) 60%, transparent); white-space: nowrap; }
.s-weak, .s-exposed, .s-burn, .s-glitch { background: color-mix(in srgb, var(--bad) 18%, transparent); }
.s-might, .s-plate { background: color-mix(in srgb, var(--good) 18%, transparent); }

.mytrack, .consts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { text-align: left; display: inline-flex; gap: 6px; align-items: center; font-size: 13px; padding: 4px 8px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); min-width: 0; overflow-wrap: anywhere; }
.chip.is-yours { background: color-mix(in srgb, var(--accent) 9%, var(--panel)); }
.chip.is-target { border-style: dashed; border-color: var(--accent); cursor: pointer; }
.chip.is-chosen { outline: 2px solid var(--accent); }
.const { display: grid; gap: 1px; padding: 4px 8px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--fc) 45%, var(--line)); background: var(--panel); max-width: 100%; }
.const b { font-family: var(--font-display); font-weight: 400; font-size: 15px; color: var(--fc); }
.const small { font-size: 12px; color: var(--muted); }

.me { position: sticky; bottom: 0; z-index: 4; margin: 0 -16px -24px; padding: 8px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--panel); border-top: 2px solid var(--fc); box-shadow: 0 -8px 22px color-mix(in srgb, var(--ink) 14%, transparent); }
.me-in { display: grid; gap: 6px; }
.me-row { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.me-hp { display: inline-grid; grid-template-columns: 90px auto; gap: 8px; align-items: center; }
.me-hp .meter span { background: var(--good); }
.me .nums b { font-weight: 600; }
.incoming { padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); }
.incoming.is-hurt { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); }
.incoming.is-lethal { background: color-mix(in srgb, var(--bad) 18%, var(--panel)); border-color: var(--bad); font-weight: 600; }
.incoming.is-safe { color: var(--good); }
.incoming b { color: var(--bad); }
.me-pdx { display: inline-flex; gap: 6px; align-items: center; }
.me-pdx.is-high .nums { color: var(--tear); font-weight: 600; }
.me-act { justify-content: space-between; }
.me-btns { display: inline-flex; gap: 8px; margin-left: auto; }
.me-btns button { padding: 8px 14px; }
.pool { display: inline-flex; flex-wrap: wrap; gap: 3px; }
.pip { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 3px; border-radius: 5px; font: 600 13px/1 var(--font-data); border: 1px solid currentColor; }
.p-faith { color: var(--faith); }
.p-compute { color: var(--compute); }
.p-flux { color: var(--flux); }
.p-neutral, .p-generic, .p-free { color: var(--neutral); }
.debt { font-size: 13px; color: var(--bad); }
.pdx { display: inline-flex; gap: 2px; }
.pdx i { display: block; width: 10px; height: 9px; border-radius: 2px; background: color-mix(in srgb, var(--line) 80%, transparent); }
.pdx i.on { background: var(--flux); }
.pdx i.last { outline: 1px solid var(--tear); }
.sig { font-weight: 700; border-color: color-mix(in srgb, var(--fc) 55%, var(--line)); }
.sig.is-on { outline: 2px solid var(--accent); }

.hand { display: grid; gap: 6px; }
.hand-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; justify-content: space-between; }
.zones { display: inline-flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.card { text-align: left; display: grid; gap: 3px; align-content: start; padding: 7px 8px; border-radius: var(--radius); background: var(--panel); border: 1px solid color-mix(in srgb, var(--fc) 40%, var(--line)); transition: transform 120ms ease, box-shadow 120ms ease; min-width: 0; }
.card.is-on { outline: 2px solid var(--accent); transform: translateY(-3px); box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 25%, transparent); }
.card.is-blank { opacity: 0.55; background-image: repeating-linear-gradient(135deg, transparent 0 8px, color-mix(in srgb, var(--tear) 14%, transparent) 8px 10px); }
.card-top { display: flex; justify-content: space-between; gap: 6px; align-items: center; }
.card-cost { display: inline-flex; gap: 3px; }
.card-cost.is-changed .pip { border-style: dashed; }
.card-type { font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); text-align: right; }
.card-name { font-family: var(--font-display); font-size: 17px; line-height: 1.1; color: var(--fc); }
.card-text { font-size: 13px; line-height: 1.35; }
.card-tags { font-size: 11px; color: var(--accent); font-weight: 700; }
.other .card { opacity: 0.85; border-style: dashed; }

.drawer { display: grid; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.log { display: grid; gap: 4px; }
.log-lines { margin: 0; padding-left: 0; list-style: none; font-size: 12px; color: var(--muted); display: grid; gap: 1px; max-height: 260px; overflow: auto; }
.log-lines li.round { margin-top: 4px; font-weight: 700; }

/* The play sheet */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; max-height: 58vh; overflow: auto; background: var(--panel); border-top: 1px solid var(--line); box-shadow: 0 -10px 30px color-mix(in srgb, var(--ink) 18%, transparent); padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
.sheet-inner { max-width: 920px; margin: 0 auto; display: grid; gap: 10px; }
.sheet-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 10px; align-items: center; position: sticky; top: -12px; z-index: 1; margin-top: -12px; padding-top: 12px; padding-bottom: 4px; background: var(--panel); }
.sheet-name { min-width: 0; }
.sheet-space { height: 55vh; }
.sheet-title { font-family: var(--font-display); font-weight: 400; font-size: 21px; }
.sheet-text { font-size: 14px; }
.sheet-error { color: var(--bad); font-weight: 700; }
.pay-preview { font-size: 14px; display: inline-flex; flex-wrap: wrap; gap: 3px; align-items: center; }
.choice-row { display: grid; gap: 6px; }
.choices { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill { font-size: 13px; padding: 5px 10px; border-radius: 999px; }
.sheet-foot { display: flex; gap: 10px; align-items: center; }

/* Modals */
.modal { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: var(--scrim); }
.modal-box { width: 100%; max-width: 580px; max-height: 88vh; overflow: auto; display: grid; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.modal-title { font-family: var(--font-display); font-weight: 400; font-size: 26px; }
.result.is-won .modal-title { color: var(--good); }
.result.is-lost .modal-title { color: var(--bad); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.fs-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; counter-reset: fs; }
.fs-list li { display: grid; gap: 6px; padding: 8px 10px; border: 1px solid color-mix(in srgb, var(--fc) 40%, var(--line)); border-radius: var(--radius); }
.fs-list li.is-bottom { opacity: 0.6; border-style: dashed; }
.fs-list li.is-take { outline: 2px solid var(--accent); }
.fs-card { display: grid; gap: 2px; }
.fs-card b { font-family: var(--font-display); font-weight: 400; font-size: 18px; color: var(--fc); }
.fs-btns { display: flex; flex-wrap: wrap; gap: 6px; }

/* Runs */
.lab-head { font-family: var(--font-display); font-weight: 400; font-size: 22px; border-top: 1px solid var(--line); padding-top: 14px; }
.lab-head span { font-family: var(--font-body); font-size: 13px; color: var(--muted); }
.runstart { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.runbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; display: grid; gap: 4px; margin: 0 -16px; padding: 8px 16px; background: color-mix(in srgb, var(--panel) 96%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); border-top: 3px solid var(--fc); }
.rb-row { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.rb-row .nums b { font-weight: 600; }
.rb-op { font-family: var(--font-display); font-weight: 400; font-size: 19px; color: var(--fc); }
.rb-hp { display: inline-grid; grid-template-columns: 90px auto; gap: 8px; align-items: center; }
.rb-hp .meter span { background: var(--good); }
.rb-pdx { display: inline-flex; gap: 6px; align-items: center; }
.rb-sub { gap: 4px 8px; }
.chiplet { display: inline-block; max-width: 100%; padding: 2px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-size: 12px; font-weight: 700; color: var(--ink); }
.rb-sub .linkish, .fightline .linkish { font-size: 12px; }
.rb-chips { display: contents; }
.runbar .rb-carry { display: none; }
.chiplet.is-ripple { border-color: color-mix(in srgb, var(--flux) 50%, var(--line)); }
.run { display: grid; gap: 14px; }
.run-title { font-family: var(--font-display); font-weight: 400; font-size: 26px; }
.moments { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.moment { text-align: left; display: grid; gap: 4px; align-content: start; min-height: 120px; padding: 12px 14px; border-radius: var(--radius); background: var(--panel); border: 1px solid color-mix(in srgb, var(--fc) 45%, var(--line)); border-top: 4px solid var(--fc); }
.moments.is-peek .moment { min-height: 0; opacity: 0.85; border-style: dashed; border-top-style: solid; }
.m-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.m-type { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fc); font-weight: 700; }
.threat { font-size: 12px; letter-spacing: 2px; color: var(--bad); }
.m-title { font-family: var(--font-display); font-size: 20px; line-height: 1.15; }
.m-hint { font-size: 13px; color: var(--muted); }
