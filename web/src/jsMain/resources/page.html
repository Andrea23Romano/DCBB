<title>Anachronist Combat Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&family=IM+Fell+English+SC&display=swap">
<style>
/* Layout: a loom. Enemies along the top, the Track as the warp across the middle, your hand as the weft below. */
:root {
  --bg: #eceef3;
  --panel: #fbfbfd;
  --ink: #1b2030;
  --muted: #586074;
  --line: #cdd3de;
  --accent: #3b4bc8;
  --on-accent: #ffffff;
  --scrim: rgba(17, 20, 32, 0.45);
  --faith: #9a6c0c;
  --compute: #08788b;
  --flux: #7443bd;
  --neutral: #687083;
  --era: #85603b;
  --tear: #b0303d;
  --good: #2b7444;
  --bad: #b0303d;
  --font-display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10121a;
    --panel: #191c27;
    --ink: #e5e7ef;
    --muted: #99a0b3;
    --line: #2b3040;
    --accent: #9aa6ff;
    --on-accent: #11131f;
    --scrim: rgba(0, 0, 0, 0.6);
    --faith: #e2b450;
    --compute: #45c3d5;
    --flux: #b48df1;
    --neutral: #a9afbd;
    --era: #c69d74;
    --tear: #f07280;
    --good: #6cc48b;
    --bad: #f07280;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10121a;
  --panel: #191c27;
  --ink: #e5e7ef;
  --muted: #99a0b3;
  --line: #2b3040;
  --accent: #9aa6ff;
  --on-accent: #11131f;
  --scrim: rgba(0, 0, 0, 0.6);
  --faith: #e2b450;
  --compute: #45c3d5;
  --flux: #b48df1;
  --neutral: #a9afbd;
  --era: #c69d74;
  --tear: #f07280;
  --good: #6cc48b;
  --bad: #f07280;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.45 var(--font-body);
  padding-inline: 16px;
  padding-block: 14px 140px;
}
#app { max-width: 920px; margin: 0 auto; display: grid; gap: 14px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
.empty { color: var(--muted); font-size: 13px; }
.label { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.label span { text-transform: none; letter-spacing: 0; font-weight: 400; }
.nums { font-family: var(--font-data); font-size: 13px; font-variant-numeric: tabular-nums; display: inline-flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }

button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: 0.45; cursor: default; }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }
.primary.big { padding: 12px 22px; font-size: 17px; }
.ghost { background: transparent; }
.linkish { justify-self: start; background: none; border: none; padding: 2px 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.linkish.is-on { font-weight: 700; }
input, textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
textarea { width: 100%; font-family: var(--font-data); font-size: 12px; }

/* Masthead and tools */
.masthead { display: grid; gap: 2px; }
.brand { font-family: var(--font-display); font-weight: 400; font-size: 30px; letter-spacing: 0.02em; line-height: 1.1; }
.brand span { color: var(--muted); font-size: 0.7em; }
.where { color: var(--muted); font-size: 13px; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; }
.tools button { font-size: 13px; padding: 5px 10px; }
.notice { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; background: color-mix(in srgb, var(--accent) 10%, var(--panel)); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); border-radius: var(--radius); padding: 10px 12px; }
.notice span { flex: 1 1 260px; min-width: 0; }
.notice button { font-size: 13px; }

/* Setup */
.setup { display: grid; gap: 18px; }
.block { display: grid; gap: 10px; }
.ops { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.op { text-align: left; display: grid; gap: 4px; padding: 12px 14px; border-color: color-mix(in srgb, var(--fc) 40%, var(--line)); }
.op.is-on { outline: 2px solid var(--fc); outline-offset: 0; background: color-mix(in srgb, var(--fc) 8%, var(--panel)); }
.op-name { font-family: var(--font-display); font-size: 22px; color: var(--fc); }
.op-meta, .op-sig { font-family: var(--font-data); font-size: 12px; color: var(--muted); }
.op-blurb { font-size: 14px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg .is-on, .pill.is-on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.encs { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
.enc { text-align: left; display: grid; gap: 2px; padding: 10px 12px; }
.enc.is-on { outline: 2px solid var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--panel)); }
.enc-name { font-weight: 700; }
.enc-where { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.enc.is-elite .enc-where { color: var(--bad); }
.enc-foes { font-size: 13px; }
.start { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; }
.seed { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seed input { width: 9em; font-family: var(--font-data); }
details summary { cursor: pointer; font-weight: 700; }
details[open] { display: grid; gap: 8px; }
.decklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.decklist li { display: grid; grid-template-columns: auto auto 1fr; gap: 2px 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line); }
.dl-count { font-family: var(--font-data); font-size: 12px; color: var(--muted); }
.dl-name { font-family: var(--font-display); font-size: 17px; color: var(--fc, var(--ink)); }
.dl-cost { white-space: nowrap; }
.dl-text { grid-column: 1 / -1; font-size: 13px; color: var(--muted); min-width: 0; }

/* Board */
.board { display: grid; gap: 14px; }
.enemies { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.enemy { text-align: left; display: grid; gap: 6px; align-content: start; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.enemy.is-target { border-style: dashed; border-color: var(--accent); cursor: pointer; }
.enemy.is-chosen { outline: 2px solid var(--accent); }
.enemy.is-dead { opacity: 0.45; }
.enemy-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.enemy-name { font-family: var(--font-display); font-size: 19px; }
.tag { font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--fc); white-space: nowrap; }
.meter { display: block; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--line) 70%, transparent); overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--bad); }
.you .meter span { background: var(--good); }
.intents { display: grid; gap: 4px; }
.intent { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
.dial { flex: none; display: inline-grid; place-items: center; width: 22px; height: 22px; border: 1.5px solid currentColor; border-radius: 50%; font: 600 12px/1 var(--font-data); }
.dmg { font-family: var(--font-data); color: var(--bad); }
.pressure { font-size: 12px; color: var(--faith); white-space: nowrap; }
.fixed { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; border: 1px solid var(--muted); border-radius: 4px; padding: 0 4px; color: var(--muted); }
.status { font-family: var(--font-body); font-size: 12px; border-radius: 999px; padding: 0 8px; background: color-mix(in srgb, var(--line) 60%, transparent); }
.s-weak, .s-exposed, .s-burn, .s-glitch { background: color-mix(in srgb, var(--bad) 18%, transparent); }
.s-might, .s-plate { background: color-mix(in srgb, var(--good) 18%, transparent); }

.track { display: grid; gap: 8px; }
.lanes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.lane { display: grid; gap: 6px; align-content: start; padding: 8px; border-radius: var(--radius); background: color-mix(in srgb, var(--panel) 55%, transparent); border: 1px solid var(--line); min-width: 0; }
.lane h3 { display: flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.chip { text-align: left; display: grid; gap: 2px; font-size: 13px; padding: 6px 8px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); min-width: 0; overflow-wrap: anywhere; }
.chip .who { font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.chip.is-yours { background: color-mix(in srgb, var(--accent) 9%, var(--panel)); }
.chip.is-target { border-style: dashed; border-color: var(--accent); cursor: pointer; }
.chip.is-chosen { outline: 2px solid var(--accent); }

.you { display: grid; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.you-head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
.you-name { font-family: var(--font-display); font-size: 22px; font-weight: 400; color: var(--fc); }
.row { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.pool { display: inline-flex; gap: 3px; }
.pip { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 3px; border-radius: 5px; font: 600 13px/1 var(--font-data); border: 1px solid currentColor; }
.p-faith { color: var(--faith); }
.p-compute { color: var(--compute); }
.p-flux { color: var(--flux); }
.p-neutral, .p-generic, .p-free { color: var(--neutral); }
.debt { font-size: 13px; color: var(--bad); }
.pdx { display: inline-flex; gap: 2px; }
.pdx i { display: block; width: 12px; height: 10px; border-radius: 2px; background: color-mix(in srgb, var(--line) 80%, transparent); }
.pdx i.on { background: var(--flux); }
.pdx i.last { outline: 1px solid var(--tear); }
.constants .const { display: grid; gap: 1px; padding: 4px 8px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--fc) 45%, var(--line)); max-width: 100%; }
.const b { font-family: var(--font-display); font-weight: 400; font-size: 15px; color: var(--fc); }
.const small { font-size: 12px; color: var(--muted); }
.act { justify-content: space-between; }
.sig { font-weight: 700; border-color: color-mix(in srgb, var(--fc) 55%, var(--line)); }
.sig.is-on { outline: 2px solid var(--accent); }

.hand { display: grid; gap: 8px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 8px; }
.card { text-align: left; display: grid; gap: 4px; align-content: start; min-height: 128px; padding: 9px 10px; border-radius: var(--radius); background: var(--panel); border: 1px solid color-mix(in srgb, var(--fc) 40%, var(--line)); transition: transform 120ms ease, box-shadow 120ms ease; }
.card.is-on { outline: 2px solid var(--accent); transform: translateY(-3px); box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 25%, transparent); }
.card.is-blank { opacity: 0.55; background-image: repeating-linear-gradient(135deg, transparent 0 8px, color-mix(in srgb, var(--tear) 14%, transparent) 8px 10px); }
.card-top { display: flex; justify-content: space-between; gap: 6px; align-items: center; }
.card-cost { display: inline-flex; gap: 3px; }
.card-cost.is-changed .pip { border-style: dashed; }
.card-type { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); text-align: right; }
.card-name { font-family: var(--font-display); font-size: 18px; line-height: 1.15; color: var(--fc); }
.card-text { font-size: 13px; }
.card-tags { font-size: 11px; color: var(--accent); font-weight: 700; }
.other .card { opacity: 0.85; border-style: dashed; }

.drawer { display: grid; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.log { display: grid; gap: 6px; }
.log-lines { margin: 0; padding-left: 0; list-style: none; font-size: 13px; display: grid; gap: 2px; max-height: 300px; overflow: auto; }
.log-lines li.round { margin-top: 6px; font-weight: 700; color: var(--muted); }

/* The play sheet */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; max-height: 62vh; overflow: auto; background: var(--panel); border-top: 1px solid var(--line); box-shadow: 0 -10px 30px color-mix(in srgb, var(--ink) 18%, transparent); padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
.sheet-inner { max-width: 920px; margin: 0 auto; display: grid; gap: 10px; }
.sheet-head { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.sheet-title { font-family: var(--font-display); font-weight: 400; font-size: 21px; }
.sheet-text { font-size: 14px; }
.sheet-error { color: var(--bad); font-weight: 700; }
.pay-preview { font-size: 14px; display: inline-flex; flex-wrap: wrap; gap: 3px; align-items: center; }
.choice-row { display: grid; gap: 6px; }
.choices { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill { font-size: 13px; padding: 5px 10px; border-radius: 999px; }
.sheet-foot { display: flex; gap: 10px; align-items: center; }

/* Modals */
.modal { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: var(--scrim); }
.modal-box { width: 100%; max-width: 580px; max-height: 88vh; overflow: auto; display: grid; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.modal-title { font-family: var(--font-display); font-weight: 400; font-size: 26px; }
.result.is-won .modal-title { color: var(--good); }
.result.is-lost .modal-title { color: var(--bad); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.fs-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; counter-reset: fs; }
.fs-list li { display: grid; gap: 6px; padding: 8px 10px; border: 1px solid color-mix(in srgb, var(--fc) 40%, var(--line)); border-radius: var(--radius); }
.fs-list li.is-bottom { opacity: 0.6; border-style: dashed; }
.fs-list li.is-take { outline: 2px solid var(--accent); }
.fs-card { display: grid; gap: 2px; }
.fs-card b { font-family: var(--font-display); font-weight: 400; font-size: 18px; color: var(--fc); }
.fs-btns { display: flex; flex-wrap: wrap; gap: 6px; }

@media (max-width: 640px) {
  .lanes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .brand { font-size: 26px; }
}
@media (prefers-reduced-motion: reduce) {
  .card { transition: none; }
  .card.is-on { transform: none; }
}
</style>
<!--BODY-->
<div id="app"><p class="muted">Loading the combat prototype…</p></div>
